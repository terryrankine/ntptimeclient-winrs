# ntptimeclient-winrs configuration. UNSIGNED PREVIEW.
#
# WHERE THIS FILE GOES. The service reads a file named config.toml in the
# SAME folder as ntptimeclient-winrs.exe. It does not read it from the state
# directory (C:\ProgramData\ntptimeclient-winrs). Copy this file to
# config.toml from an elevated shell. The folder and the file must be
# admin-only, because the service loads the file as LocalSystem at every
# start. Anyone who can write it controls the clock. The exe refuses to run
# from a folder that is not admin-only, and it refuses a folder with stray
# files in it, so keep config.toml as the one addition.
#
# Every key is optional. An empty file gives the same values as this file.
# An unknown key is an error, so a typo cannot silently leave a safety
# setting at its default.
#
# Rules the file must meet, or the service refuses to start with it:
#   min_poll_s is 64 to 128, max_poll_s is at most 1024, and min_poll_s is
#   not above max_poll_s.
#   step_threshold_ms is above 0 and at least min_poll_s (plain numbers).
#   panic_threshold_s times 1000 is above step_threshold_ms.
#   servers has at most 16 entries. Each entry and pool is a valid host name
#   or IP address with no port.
#   state_dir is an absolute path.
#
# Time sources are used in strict order. The config servers come first.
# DHCP servers come next. The pool comes last. The first tier that has a
# usable source is used on its own. The tiers are never mixed.

# Your own time servers. Host names or IP addresses. At most 16.
# The port is always 123. Use full DNS names or IP addresses. A bare name
# such as "ntp" or a ".local" name may be answered by anyone on the LAN.
# Default: none. Example:
#   servers = ["time.example.com", "192.0.2.7"]
servers = []

# Use NTP servers offered by DHCP when no config server is usable.
# Default: true.
dhcp = true

# The last-resort pool. It is also queried in observe-only mode while a
# config or DHCP tier is active, as a cross-check. It never feeds the choice
# of source in that case. Default: pool.ntp.org.
pool = "pool.ntp.org"

# A clock error above this many milliseconds may be corrected by one
# step. A smaller error is corrected by slewing (a gentle change of clock
# rate). Default: 128.
# The check compares step_threshold_ms (milliseconds) with min_poll_s
# (seconds) as plain numbers: step_threshold_ms must be at least min_poll_s.
# The reason is the pool cross-check margin, which grows with the poll time.
step_threshold_ms = 128

# A step above this many seconds is refused unless allow_panic_step is true.
# Default: 1000.
panic_threshold_s = 1000

# Allow a step above panic_threshold_s. Leave this false unless you know why
# you need it. Default: false.
allow_panic_step = false

# Shortest time between polls of a source, in seconds. 64 to 128.
# Default: 64.
min_poll_s = 64

# Longest time between polls of a source, in seconds. At most 1024.
# Default: 1024.
max_poll_s = 1024

# Where the service keeps its files: the saved drift value, restore.json (the
# record of the old w32time state) and the status file. At start the service
# secures this folder through the platform code (not the installer): only
# SYSTEM and Administrators may write to it. It must be an absolute local
# drive path with plain components. A link or junction in it is refused,
# and every parent folder must be owned by SYSTEM, Administrators or
# TrustedInstaller. Single quotes keep the backslashes literal.
# Default: C:\ProgramData\ntptimeclient-winrs
state_dir = 'C:\ProgramData\ntptimeclient-winrs'
