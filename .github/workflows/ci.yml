name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7.0.1
      # dtolnay/rust-toolchain stable branch, pinned by commit
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pwsh scripts/check-deps.ps1

  core-portable:
    name: core builds on linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # dtolnay/rust-toolchain stable branch, pinned by commit
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build -p ntpc-core
      - run: cargo test -p ntpc-core
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  fuzz-smoke:
    name: fuzz smoke (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find fuzz targets
        id: targets
        shell: bash
        run: |
          shopt -s nullglob
          files=(fuzz/fuzz_targets/*.rs)
          names=""
          for f in "${files[@]}"; do names="$names $(basename "$f" .rs)"; done
          echo "names=${names# }" >> "$GITHUB_OUTPUT"
      - if: steps.targets.outputs.names != ''
        # dtolnay/rust-toolchain nightly branch, pinned by commit
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04
        with:
          toolchain: nightly
      - if: steps.targets.outputs.names != ''
        run: cargo install cargo-fuzz --locked
      - if: steps.targets.outputs.names != ''
        shell: bash
        run: |
          for t in ${{ steps.targets.outputs.names }}; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
