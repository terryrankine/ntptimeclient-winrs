name: ci

# Checks on every push to main and every pull request. A nightly run adds the
# fuzz smoke test. The windows job also builds the release exe, gates it and
# uploads it as a workflow artifact, so every green run leaves a binary.
# That binary is a CI build. Releases come only from release.yml (docs/releasing.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Pushes to main
# and scheduled runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-rules:
    name: version and workflow rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Version is SemVer and in the allowed form
        shell: pwsh
        run: ./scripts/check-version.ps1
      - name: Workflows are pinned and free of placeholders
        shell: pwsh
        run: ./scripts/check-workflows.ps1

  windows:
    name: windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pwsh scripts/check-deps.ps1
      # The packaging scripts are written for the inbox Pester 3.4 in Windows
      # PowerShell. The runner also has a newer Pester, so 3.4.0 is imported by
      # version. UNVERIFIED on the runner. If the import fails, this step fails
      # loudly. It is never skipped quietly.
      - name: Packaging tests (Pester 3.4, Windows PowerShell)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester -Path packaging/tests -PassThru
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { exit 1 }

  release-build:
    name: release exe (gated, uploaded)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build --release --locked -p ntpc-service
      - name: Gate the built exe
        shell: pwsh
        run: ./scripts/gate-exe.ps1
      - name: Hash the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path ci-dist -Force | Out-Null
          Copy-Item target/release/ntptimeclient-winrs.exe ci-dist/
          $h = (Get-FileHash ci-dist/ntptimeclient-winrs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('ci-dist/ntptimeclient-winrs.exe.sha256', "$h  ntptimeclient-winrs.exe`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-exe-${{ github.sha }}
          path: ci-dist/*
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: minimum rust version (1.88)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  core-portable:
    name: core builds on linux, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build -p ntpc-core --locked
      - run: cargo test -p ntpc-core --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1

  fuzz-smoke:
    name: fuzz smoke (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Find fuzz targets
        id: targets
        shell: bash
        run: |
          shopt -s nullglob
          files=(fuzz/fuzz_targets/*.rs)
          names=""
          for f in "${files[@]}"; do names="$names $(basename "$f" .rs)"; done
          echo "names=${names# }" >> "$GITHUB_OUTPUT"
      - if: steps.targets.outputs.names != ''
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04  # nightly
        with:
          toolchain: nightly
      - if: steps.targets.outputs.names != ''
        run: cargo install cargo-fuzz --locked
      - if: steps.targets.outputs.names != ''
        shell: bash
        env:
          TARGETS: ${{ steps.targets.outputs.names }}
        run: |
          for t in $TARGETS; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
