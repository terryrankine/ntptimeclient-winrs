name: release

# Builds the UNSIGNED zip and publishes it. Rules: docs/releasing.md.
#
# - A push of a tag "vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N]" runs the
#   version checks, builds, gates the exe, uploads the zip as a workflow
#   artifact and attaches it to a GitHub release. A tag with a pre-release
#   part, or a 0.x version, is marked as a GitHub PRE-RELEASE.
# - The tag must equal "v" + the Cargo.toml version, and its commit must be on
#   main. Otherwise the run stops before anything is built.
# - A manual run (workflow_dispatch) is a dry run. It builds and uploads the
#   artifact only. It never publishes a release.
#
# There is NO code signing step. Releases are unsigned on purpose until
# SignPath Foundation (or another route) is set up. That is a human decision
# and is not made here. No secret other than the built-in GITHUB_TOKEN is used.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# One release build per ref at a time. A second tag push waits. It never
# cancels a build that may be half way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: version and tag rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Workflows are pinned and free of placeholders
        shell: pwsh
        run: ./scripts/check-workflows.ps1
      - name: Tag equals the Cargo version
        id: v
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
            ./scripts/check-version.ps1 -Tag $env:REF_NAME -GithubOutput $env:GITHUB_OUTPUT
          } else {
            ./scripts/check-version.ps1 -GithubOutput $env:GITHUB_OUTPUT
          }
      - name: Tag commit is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not on main. Merge first, then tag." >&2
            exit 1
          fi

  build:
    name: build and gate the exe
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      exe_artifact_id: ${{ steps.exe.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      # No build cache here. A release build must not depend on cache contents
      # that an earlier pull request run could have written.

      - name: Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup show
          rustc -vV
          cargo -V
          if ((((rustc -vV) -join "`n")) -notmatch 'host: x86_64-pc-windows-msvc') { Write-Error 'host is not x86_64-pc-windows-msvc'; exit 1 }

      - name: Build release binary
        run: cargo build --release --locked -p ntpc-service

      # Exe gate: scripts/gate-exe.ps1 (same probes as ci.yml). A stub exe, or
      # one with another CLI, is never packaged. The probes are non-mutating.
      - name: Gate the built exe
        shell: pwsh
        run: ./scripts/gate-exe.ps1

      # Packaging tests. The scripts are written for the inbox Pester 3.4 in
      # Windows PowerShell. The runner also has a newer Pester, and "Should Be"
      # tests with shared variables do not run on it, so 3.4.0 is imported by
      # version. UNVERIFIED on the runner: 3.4.0 was present on the author's
      # machine only. If the import fails here, this step fails loudly and the
      # fix is to install or vendor that version. It is never skipped quietly.
      - name: Packaging tests (Pester 3.4, Windows PowerShell)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester -Path packaging/tests -PassThru
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { exit 1 }

      - name: Test
        run: cargo test --workspace --locked

      - name: Dependency rule
        run: pwsh scripts/check-deps.ps1

      - name: Collect the exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path exe-out -Force | Out-Null
          Copy-Item -LiteralPath target/release/ntptimeclient-winrs.exe -Destination exe-out/
      # The exe goes to SignPath as a GitHub artifact when signing is on, and to
      # the package job either way.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        id: exe
        with:
          name: unsigned-exe
          path: exe-out/ntptimeclient-winrs.exe
          if-no-files-found: error
          retention-days: 30

  sign:
    name: sign the exe (SignPath Foundation)
    needs: [verify, build]
    # Runs only for a real tag, and only once the repo variable SIGNPATH_ORGANIZATION_ID
    # is set (docs/signing.md). Until then the release is unsigned and this job is skipped.
    if: github.event_name == 'push' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing request waits for a person to approve it in SignPath. That is a policy requirement.
    permissions:
      contents: read
      actions: read
    steps:
      # signpath/github-action-submit-signing-request v2, commit looked up with `gh api` on 2026-11-11
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.exe_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-exe
          path: signed/ntptimeclient-winrs.exe
          if-no-files-found: error
          retention-days: 30

  package:
    name: package the zip
    needs: [verify, build, sign]
    # The sign job is skipped when signing is not set up. A failed signing run stops the release.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      zip_name: ${{ steps.assemble.outputs.zip_name }}
      zip_sha256: ${{ steps.assemble.outputs.zip_sha256 }}
      signed: ${{ steps.pick.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - name: Pick the exe
        id: pick
        shell: pwsh
        env:
          SIGN_RESULT: ${{ needs.sign.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = if ($env:SIGN_RESULT -eq 'success') { 'true' } else { 'false' }
          "signed=$signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'signed-exe' || 'unsigned-exe' }}
          path: exe-in
      - name: Check the exe (gate, and signature when signed)
        shell: pwsh
        env:
          SIGNED: ${{ steps.pick.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'exe-in/ntptimeclient-winrs.exe'
          ./scripts/gate-exe.ps1 -Exe $exe
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "Authenticode status: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:SIGNED -eq 'true' -and $sig.Status -ne 'Valid') { Write-Error "Signed exe has status $($sig.Status)"; exit 1 }
          if ($env:SIGNED -ne 'true' -and $sig.Status -ne 'NotSigned') { Write-Error "Unsigned build has status $($sig.Status)"; exit 1 }

      - name: Assemble zip
        id: assemble
        shell: pwsh
        env:
          # Passed as env, never spliced into the script, so a tag name cannot inject commands.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          SIGNED: ${{ steps.pick.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { 'dispatch-' + $env:COMMIT_SHA.Substring(0, 7) }
          # The tag ends up in a file name. Allow only plain characters.
          if ($tag -notmatch '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$') { Write-Error "Unusable tag name: $tag"; exit 1 }

          $mark = if ($env:SIGNED -eq 'true') { 'SIGNED' } else { 'UNSIGNED-PREVIEW' }
          $base = "ntptimeclient-winrs-$tag-$mark-x86_64-windows"
          $stage = Join-Path 'dist' $base
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath 'exe-in/ntptimeclient-winrs.exe' -Destination (Join-Path $stage 'ntptimeclient-winrs.exe')

          foreach ($f in 'install.ps1', 'uninstall.ps1', 'preview-common.ps1', 'default-config.toml', 'README-PREVIEW.txt') {
            Copy-Item -LiteralPath (Join-Path 'packaging' $f) -Destination $stage
          }
          Copy-Item -LiteralPath 'LICENSE-MIT', 'LICENSE-APACHE' -Destination $stage

          # Old Notepad shows LF-only text on one line. The README ships with
          # CRLF. This is done before SHA256SUMS is computed.
          $readme = Join-Path $stage 'README-PREVIEW.txt'
          $text = [System.IO.File]::ReadAllText($readme) -replace "`r?`n", "`r`n"
          [System.IO.File]::WriteAllText($readme, $text, (New-Object System.Text.UTF8Encoding($false)))

          # Reproducibility notes. The toolchain floats on "stable", so the
          # compiler version is recorded here instead of being pinned.
          $rustc = (rustc -vV) -join "`n"
          $version = @(
            'product: ntptimeclient-winrs'
            $(if ($env:SIGNED -eq 'true') { 'signing: signed via SignPath Foundation' } else { 'signing: UNSIGNED PREVIEW, NOT FOR MACHINES THAT MATTER' })
            "version: $($env:VERSION)"
            "release channel: $($env:CHANNEL)"
            "tag: $tag"
            "commit: $($env:COMMIT_SHA)"
            'target: x86_64-pc-windows-msvc'
            "cargo: $((cargo -V))"
            "runner image: $($env:ImageOS) $($env:ImageVersion)"
            'built with: cargo build --release --locked -p ntpc-service'
            'rustc -vV:'
            $rustc
          ) -join "`n"
          [System.IO.File]::WriteAllText((Join-Path $stage 'VERSION'), $version + "`n", (New-Object System.Text.UTF8Encoding($false)))

          # SHA256SUMS covers every other file in the zip. LF line ends, "hash  name".
          $lines = Get-ChildItem -LiteralPath $stage -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $stage 'SHA256SUMS'), ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))

          $zip = Join-Path 'dist' "$base.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$zip.sha256", "$zipHash  $base.zip`n", (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item -LiteralPath $stage -Recurse -Force
          Get-ChildItem dist | Format-Table Name, Length
          "zip_name=$base.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_sha256=$zipHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: attach to pre-release
    needs: [verify, package]
    # Real tag pushes only. A manual run stops after the artifact upload.
    # !cancelled() is needed: sign is skipped when signing is off, and the default
    # success() check would skip this job too because a skipped job is an ancestor.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.package.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-zip
          path: dist
      - name: Create pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          SIGNED: ${{ needs.package.outputs.signed }}
          # The hash comes from the build job output, not from a file in the
          # artifact. The zip is compared with it before it is published.
          ZIP_SHA256: ${{ needs.package.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "dist/${ZIP_NAME}" | cut -d' ' -f1)"
          if [ "$actual" != "$ZIP_SHA256" ]; then
            echo "zip hash $actual does not match the build job output $ZIP_SHA256" >&2
            exit 1
          fi
          if [ "$SIGNED" = "true" ]; then
            cat > notes.md <<'EOF'
          # Signed release

          The exe is signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation.

          - It sets the system clock and stops and disables the Windows Time service (w32time).
          - Read README-PREVIEW.txt inside the zip before you run anything.
          - Extract only into a folder that only administrators can write.
          EOF
          else
            cat > notes.md <<'EOF'
          # UNSIGNED. NOT FOR MACHINES THAT MATTER.

          - The binary is not code signed. Windows SmartScreen, Smart App Control or antivirus may warn or block it (unverified).
          - It sets the system clock and stops and disables the Windows Time service (w32time).
          - Use it only on a throwaway virtual machine with a snapshot.
          - No accuracy figure is promised.

          Read README-PREVIEW.txt inside the zip before you run anything.
          Extract only into a folder that only administrators can write. Install and uninstall with the scripts in the zip. Both need an elevated PowerShell.
          The hash file inside the zip finds accidental damage only. It does not prove the zip is genuine.
          EOF
          fi
          printf '\nSHA-256 of the zip:\n\n    %s  %s\n' "$ZIP_SHA256" "$ZIP_NAME" >> notes.md
          flags=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" \
            --title "$TAG ($CHANNEL)" \
            --notes-file notes.md \
            "dist/${ZIP_NAME}" "dist/${ZIP_NAME}.sha256"
