[package]
name = "ntpc-core"
description = "Sans-IO NTP client engine. No OS or network dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Simulation world used by the scenario tests in tests/scenarios.rs.
sim = []

[dependencies]
thiserror.workspace = true

[lints]
workspace = true

# The scenarios need the simulated world. Without the feature they are
# skipped, so a plain `cargo test` stays free of sim code.
[[test]]
name = "scenarios"
required-features = ["sim"]
