[package]
name = "ntpc-service"
description = "Windows service binary that wires the core to the platform adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library keeps the crate name. The exe is named after the product,
# which the Task 15 scripts and workflow expect.
[[bin]]
name = "ntptimeclient-winrs"
path = "src/main.rs"

[dependencies]
ntpc-core.workspace = true
ntpc-platform.workspace = true
getrandom.workspace = true
toml.workspace = true
serde.workspace = true
thiserror.workspace = true

[build-dependencies]
embed-resource.workspace = true

# The scripted ServiceControl for the install and uninstall tests.
[dev-dependencies]
ntpc-platform = { workspace = true, features = ["fake"] }

[lints]
workspace = true
