[workspace]
resolver = "3"
members = ["crates/ntpc-core", "crates/ntpc-platform", "crates/ntpc-service"]
# The spike probe is throwaway and must never join the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
ntpc-core = { path = "crates/ntpc-core" }
ntpc-platform = { path = "crates/ntpc-platform" }
# Packet parser only. Every public item sits behind `__internal-api`, so the
# exact pin forces a review of each bump (Task 1 note).
ntp-proto = { version = "=1.9.0", default-features = false, features = ["rustcrypto", "__internal-api"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
