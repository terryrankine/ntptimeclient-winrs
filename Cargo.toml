[workspace]
resolver = "3"
members = ["crates/ntpc-core", "crates/ntpc-platform", "crates/ntpc-service"]
# The spike probe is throwaway and must never join the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2"
ntpc-core = { path = "crates/ntpc-core" }
ntpc-platform = { path = "crates/ntpc-platform" }
# OS CSPRNG for the NTP request nonce. On Windows it adds only `cfg-if`.
getrandom = "0.4"
# Config file. Parse and serde only, no writer or display code.
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
serde = { version = "1", features = ["derive"] }
# Build time only. Embeds the Windows version resource (product name and version) that code signing needs.
embed-resource = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
